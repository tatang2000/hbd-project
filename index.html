<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Intan!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        
        body { 
            background-color: #000; 
            color: #fff; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        /* --- PEMANDANGAN FAJAR (SUNRISE) --- */
        #sunrise-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; 
            opacity: 0; 
            transition: opacity 6s ease-in-out;
        }
        #sunrise-sky {
            position: absolute; top: 0; left: 0; width: 100%; height: 55%;
            background: linear-gradient(to bottom, #0b0d17 0%, #4a154b 50%, #ff7a59 100%);
        }
        #sunrise-sea {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
            background: linear-gradient(to bottom, #004e92 0%, #000428 100%);
            z-index: 2;
            border-top: 1px solid #1a8cff; 
        }
        .sun {
            position: absolute;
            bottom: 35%; 
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: #ffdf00;
            border-radius: 50%;
            box-shadow: 0 0 60px #ff9900;
            transition: bottom 6s ease-in-out;
            z-index: 1; 
        }
        #sunrise-bg.dawn-active { opacity: 1; }
        #sunrise-bg.dawn-active .sun { bottom: 48%; }

        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #startScreen button {
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        #startScreen button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
        }

        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; 
        }

        #vn-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; 
        }

        .text-box {
            width: 80%;
            max-width: 900px;
            min-height: 250px;
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            font-size: 1.6rem;
            line-height: 1.8;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto; 
            transition: all 0.5s;
            position: relative;
        }

        .cursor {
            display: inline-block;
            width: 12px;
            background-color: #fff;
            animation: blink 0.8s infinite;
            margin-left: 2px;
            vertical-align: baseline;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- 3 FOTO POLAROID BESAR BERTEBARAN & SALING TUMPUK --- */
        .polaroid {
            position: absolute;
            background: #fff;
            padding: 12px 12px 45px 12px; /* Bingkai ala polaroid diperbesar */
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            opacity: 0;
            pointer-events: none;
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .polaroid img {
            width: 220px;  /* Ukuran Foto Diperbesar */
            height: 220px;
            object-fit: cover;
            filter: grayscale(100%); 
        }
        
        /* Posisi awal (agak ke bawah) dan Z-index diatur agar saling tumpuk */
        .p1 { top: 60%; left: 35%; transform: translate(-50%, 50px) rotate(-20deg); z-index: 20; }
        .p2 { top: 60%; left: 50%; transform: translate(-50%, 50px) rotate(0deg); z-index: 21; }
        .p3 { top: 60%; left: 65%; transform: translate(-50%, 50px) rotate(20deg); z-index: 22; }

        /* Posisi akhir (Tepat menumpuk teks di tengah) */
        .p1.show { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg); top: 38%; }
        .p2.show { opacity: 1; transform: translate(-50%, -50%) rotate(4deg); top: 40%; }
        .p3.show { opacity: 1; transform: translate(-50%, -50%) rotate(18deg); top: 38%; }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            border: none;
            font-size: 4rem;
            cursor: pointer;
            pointer-events: auto; 
            transition: 0.3s ease;
            padding: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        
        .nav-btn:hover { color: #fff; text-shadow: 0 0 25px #fff; }
        .left-btn { left: 30px; }
        .right-btn { right: 30px; }

        #player { display: none; }

        /* --- CSS KUE STRAWBERRY --- */
        .cake-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1s forwards;
            position: relative;
        }
        
        .click-indicator {
            position: absolute;
            top: -75px; left: 50%;
            transform: translateX(-50%);
            color: #ffaa00; font-size: 2.5rem;
            animation: bounceArrow 1s infinite;
            pointer-events: none; z-index: 5;
            text-shadow: 0 0 15px #ff0043;
        }

        .cake-wrapper { position: relative; width: 150px; display: flex; flex-direction: column; align-items: center; }
        
        .cake-flame {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 24px; background: #ffaa00;
            border-radius: 50% 50% 20% 20%;
            box-shadow: 0 0 15px #ffaa00, 0 0 30px #ff0043;
            cursor: pointer; animation: flicker 0.1s infinite alternate; z-index: 25; transition: 0.3s;
        }
        .cake-flame:hover { transform: translateX(-50%) scale(1.2); }
        
        .cake-smoke {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
            width: 10px; height: 10px; background: #ccc; border-radius: 50%; opacity: 0; z-index: 5;
        }
        .cake-smoke.puff { animation: blowOutSmoke 1.5s forwards; }
        
        .cake-candle {
            width: 12px; height: 40px;
            background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ff4d4d 4px, #ff4d4d 8px);
            margin: 0 auto; border-radius: 3px; position: relative; z-index: 2;
        }

        /* Krim Strawberry Pink */
        .cake-frosting {
            position: absolute; width: 140px; height: 35px; background: #ffcce6;
            border-radius: 20px; top: 30px; z-index: 3; box-shadow: 0 5px 5px rgba(0,0,0,0.3);
        }

        /* Buah Strawberry Merah */
        .berry {
            position: absolute; width: 18px; height: 20px;
            background: radial-gradient(circle at 30% 30%, #ff6666, #b30000);
            border-radius: 50% 50% 40% 40%; z-index: 4; box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
        }
        .berry1 { left: 20px; top: 25px; } .berry2 { left: 65px; top: 20px; } .berry3 { right: 20px; top: 28px; }
        
        /* Badan Kue Gradien Pink */
        .cake-body {
            width: 124px; height: 60px;
            background: linear-gradient(to right, #d85c8a, #ff7eb3, #d85c8a);
            border-radius: 5px 5px 8px 8px; position: relative; z-index: 1;
            margin-top: -15px; box-shadow: inset 0 -10px 15px rgba(0,0,0,0.4);
        }
        
        .tiup-text {
            margin-top: 25px; font-size: 1.1rem; color: #ffaa00; font-weight: bold;
            animation: pulse 1.5s infinite; letter-spacing: 1px; z-index: 25; position: relative;
        }

        @keyframes bounceArrow { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -15px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes flicker { 0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; } 100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 0.8; } }
        @keyframes blowOutSmoke { 0% { transform: translate(-50%, 0) scale(1); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(3); opacity: 0; } }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="player"></div>

    <div id="sunrise-bg">
        <div id="sunrise-sky"></div>
        <div class="sun"></div>
        <div id="sunrise-sea"></div>
    </div>

    <div id="startScreen">
        <button onclick="startApp()">Buka Pesan</button>
    </div>

    <canvas id="fwCanvas"></canvas>

    <div id="vn-container" style="display: none;">
        <button class="nav-btn left-btn" id="prevBtn" onclick="turnPrevPage()">&#10094;</button>
        <div class="text-box" id="textBoxBox">
            
            <!-- 3 FOTO POLAROID TUMPUK -->
            <div class="polaroid p1" id="polaroid-1"><img src="foto1.jpg" alt="Memory 1"></div>
            <div class="polaroid p2" id="polaroid-2"><img src="foto2.jpg" alt="Memory 2"></div>
            <div class="polaroid p3" id="polaroid-3"><img src="foto3.jpg" alt="Memory 3"></div>
            
            <div id="textBox"></div>
        </div>
        <button class="nav-btn right-btn" id="nextBtn" onclick="turnNextPage()">&#10095;</button>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        var player;
        var audioCtx;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'W-NLEEyycao', 
                playerVars: { 'autoplay': 0, 'loop': 1, 'controls': 0 }
            });
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const bufferSize = audioCtx.sampleRate * 0.5; 
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass'; filter.frequency.setValueAtTime(800, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            
            noise.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
            noise.start();
        }

        function startApp() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('vn-container').style.display = 'flex';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(player && player.playVideo) { player.playVideo(); }
            updateButtons(); typeWriter();
        }

        function updateButtons() {
            document.getElementById('prevBtn').style.display = (currentPage === 0) ? 'none' : 'block';
            document.getElementById('nextBtn').style.display = (currentPage === pages.length - 1) ? 'none' : 'block';
        }

        const pages = [
            "Hallo Intan...\n\nSebenernya aku mau kasih surprise tapi kamu udah tau ya mengenai project ini hehe.",
            "Aku disini mau meminta maaf sekaligus merayakan ulang tahun kamu yang ke-20 yeeayyy🎉🎉.",
            "Aku minta maaf jika selama ini dirasa larangan ku memang begitu mengekang kamu.",
            "Baik baik disana yahh sayang\n mungkin hadiah ini ngga seberapa bagi kamu\ndan juga aku kurang bisa bikin kata kata bagus",
            "Semoga di umur yang baru ini kamu selalu diberikan kebahagiaan, kesehatan, dan semua yang kamu impikan bisa tercapai.",
            "I love you so much intan septiani basyiroh...\n\n\nganbatte neeee anataaaaa❤️ から：大切な人"
        ];

        let currentPage = 0; let charIndex = 0; let isTyping = false; let typingTimer; let finaleTriggered = false;

        function showCake() {
            if(document.getElementById('cakeUI')) return; 
            const cakeHTML = `
                <div class="cake-container" id="cakeUI">
                    <div class="click-indicator" id="clickArrow">⬇</div>
                    <div class="cake-wrapper">
                        <div class="cake-flame" id="flame" onclick="blowCandle()"></div>
                        <div class="cake-smoke" id="smoke"></div>
                        <div class="cake-candle"></div>
                        <div class="cake-frosting"></div>
                        <div class="berry berry1"></div>
                        <div class="berry berry2"></div>
                        <div class="berry berry3"></div>
                        <div class="cake-body"></div>
                    </div>
                    <p class="tiup-text" id="tiupText">KLIK APINYA UNTUK TIUP LILIN!</p>
                </div>
            `;
            document.getElementById("textBox").innerHTML += cakeHTML;
        }

        function blowCandle() {
            if(finaleTriggered) return;
            finaleTriggered = true; 
            
            document.getElementById('clickArrow').style.display = 'none'; 
            document.getElementById('flame').style.display = 'none';
            document.getElementById('smoke').classList.add('puff');
            
            document.getElementById('tiupText').innerHTML = "Yeayyy! Happy Birthday Intan! 🎉";
            document.getElementById('tiupText').style.animation = 'none';
            document.getElementById('tiupText').style.color = '#fff';
            
            // Fajar Terbit
            document.getElementById('sunrise-bg').classList.add('dawn-active');
            
            // Memunculkan ke-3 Foto satu per satu yang menumpuk di teks
            setTimeout(() => {
                document.getElementById('polaroid-1').classList.add('show');
                setTimeout(() => {
                    document.getElementById('polaroid-2').classList.add('show');
                    setTimeout(() => {
                        document.getElementById('polaroid-3').classList.add('show');
                    }, 400); 
                }, 400); 
                launchFinale(); 
            }, 800);
        }

        function typeWriter() {
            if (charIndex < pages[currentPage].length) {
                isTyping = true;
                let currentText = pages[currentPage].substring(0, charIndex + 1);
                document.getElementById("textBox").innerHTML = currentText.replace(/\n/g, '<br>') + '<span class="cursor">&nbsp;</span>';
                charIndex++;
                let speed = (currentPage === pages.length - 1) ? 180 : 45; 
                typingTimer = setTimeout(typeWriter, speed);
            } else {
                isTyping = false;
                let fullText = pages[currentPage].replace(/\n/g, '<br>');
                document.getElementById("textBox").innerHTML = fullText + '<span class="cursor">&nbsp;</span>';
                if (currentPage === pages.length - 1 && !finaleTriggered) { showCake(); }
            }
        }

        function turnNextPage() {
            if (isTyping) {
                clearTimeout(typingTimer);
                document.getElementById("textBox").innerHTML = pages[currentPage].replace(/\n/g, '<br>') + '<span class="cursor">&nbsp;</span>';
                isTyping = false;
                if (currentPage === pages.length - 1 && !finaleTriggered) { showCake(); }
            } else {
                if (currentPage < pages.length - 1) {
                    currentPage++; charIndex = 0; document.getElementById("textBox").innerHTML = "";
                    updateButtons(); typeWriter();
                }
            }
        }

        function turnPrevPage() {
            if (currentPage > 0) {
                clearTimeout(typingTimer); currentPage--; charIndex = 0;
                document.getElementById("textBox").innerHTML = ""; isTyping = false; finaleTriggered = false; 
                
                document.getElementById('sunrise-bg').classList.remove('dawn-active');
                document.getElementById('polaroid-1').classList.remove('show');
                document.getElementById('polaroid-2').classList.remove('show');
                document.getElementById('polaroid-3').classList.remove('show');
                
                updateButtons(); typeWriter();
            }
        }

        const canvas = document.getElementById('fwCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        let particles = []; const gravity = 0.04; 
        const colors = ['#ff0043', '#14fc56', '#1e7fff', '#e600ff', '#ffaa00', '#00ffff', '#ffffff'];

        class Particle {
            constructor(x, y, color, velocity, isFirework) {
                this.x = x; this.y = y; this.color = color; this.velocity = velocity;
                this.isFirework = isFirework; this.life = 100; this.alpha = 1;
            }
            draw() {
                ctx.globalAlpha = this.alpha; ctx.beginPath();
                ctx.arc(this.x, this.y, this.isFirework ? 3 : 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill();
            }
            update() {
                this.draw(); this.x += this.velocity.x; this.y += this.velocity.y;
                if (this.isFirework) { this.velocity.y += gravity; } 
                else { this.velocity.y += gravity; this.velocity.x *= 0.95; this.velocity.y *= 0.95; this.life -= 1.8; this.alpha = this.life / 100; }
            }
        }

        function createExplosion(x, y) {
            playExplosionSound(); 
            for (let i = 0; i < 30; i++) { 
                const angle = Math.random() * Math.PI * 2; const speed = Math.random() * 5 + 1;
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed }, false));
            }
        }

        function launchRandomFirework() {
            if(document.hidden) return; 
            if(document.getElementById('startScreen').style.display === 'none') {
                const x = Math.random() * canvas.width; const y = canvas.height;
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], { x: (Math.random() - 0.5) * 2.5, y: -(Math.random() * 4 + 7) }, true));
            }
        }

        function launchFinale() {
            let count = 0;
            const finaleInterval = setInterval(() => {
                if(document.hidden) return; launchRandomFirework(); count++;
                if (count > 20) clearInterval(finaleInterval); 
            }, 200);
        }

        function animate() {
            requestAnimationFrame(animate);
            ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter';
            if (particles.length > 300) { particles.splice(0, particles.length - 300); }
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i]; p.update();
                if (p.isFirework && p.velocity.y >= 0) { createExplosion(p.x, p.y); particles.splice(i, 1); } 
                else if (!p.isFirework && p.life <= 0) { particles.splice(i, 1); }
            }
        }

        setInterval(launchRandomFirework, 1500); animate();

        window.addEventListener('pointerdown', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.closest('.text-box') || e.target.id === 'flame') return; 
            const targetX = e.clientX; const targetY = e.clientY;
            const startX = Math.random() * canvas.width; const startY = canvas.height;
            const distanceY = startY - targetY; const safeDistanceY = Math.max(distanceY, 10); 
            const vy = -Math.sqrt(2 * gravity * safeDistanceY); const t = Math.abs(vy / gravity); const vx = (targetX - startX) / t; 
            particles.push(new Particle(startX, startY, colors[Math.floor(Math.random() * colors.length)], { x: vx, y: vy }, true));
        });

        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    </script>
</body>
</html>
