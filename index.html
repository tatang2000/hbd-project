<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Intan!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; }
        
        body { 
            background-color: #000; 
            color: #fff; 
            overflow: hidden; 
            height: 100vh;
            width: 100vw;
        }

        /* LAYAR AWAL */
        #startScreen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        #startScreen button {
            padding: 15px 40px;
            font-size: 1.5rem;
            cursor: pointer;
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        #startScreen button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
        }

        /* KANVAS KEMBANG API */
        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; 
        }

        /* WADAH VISUAL NOVEL */
        #vn-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none; 
        }

        .text-box {
            width: 80%;
            max-width: 900px;
            min-height: 250px;
            background: rgba(0, 0, 0, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            font-size: 1.6rem;
            line-height: 1.8;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            pointer-events: auto; 
        }

        /* TOMBOL PANAH */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            color: rgba(255, 255, 255, 0.3);
            border: none;
            font-size: 4rem;
            cursor: pointer;
            pointer-events: auto; 
            transition: 0.3s ease;
            padding: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.1);
        }
        
        .nav-btn:hover {
            color: #fff;
            text-shadow: 0 0 25px #fff;
        }

        .left-btn { left: 30px; }
        .right-btn { right: 30px; }

        /* YOUTUBE IFRAME */
        #player { display: none; }
    </style>
</head>
<body>

    <div id="player"></div>

    <div id="startScreen">
        <button onclick="startApp()">Buka Pesan</button>
    </div>

    <canvas id="fwCanvas"></canvas>

    <div id="vn-container" style="display: none;">
        <button class="nav-btn left-btn" onclick="turnPrevPage()">&#10094;</button>
        <div class="text-box" id="textBox"></div>
        <button class="nav-btn right-btn" onclick="turnNextPage()">&#10095;</button>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // --- 1. LOGIKA AUDIO YOUTUBE & AUDIO SINTETIS ---
        var player;
        var audioCtx;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'IzvZ0gOXiNA', 
                playerVars: {
                    'autoplay': 0,
                    'loop': 1,
                    'controls': 0
                }
            });
        }

        // Generator Suara Ledakan Petasan (White Noise + Lowpass Filter)
        function playExplosionSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const bufferSize = audioCtx.sampleRate * 0.8; // Durasi 0.8 detik
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            
            // Membuat suara desisan acak (noise)
            for (let i = 0; i < bufferSize; i++) {
                data[i] = Math.random() * 2 - 1;
            }
            
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            
            // Memfilter suara agar terdengar seperti "Thud/Boom" dari jauh
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.5);
            
            // Mengatur Volume (Sengaja dikecilkan agar lagu tetap dominan)
            const gainNode = audioCtx.createGain();
            gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime); // Volume rendah (0.06)
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
            
            noise.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            noise.start();
        }

        function startApp() {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('vn-container').style.display = 'flex';
            
            // Inisialisasi Audio Context untuk ledakan
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if(player && player.playVideo) {
                player.playVideo();
            }

            typeWriter();
        }

        // --- 2. LOGIKA VISUAL NOVEL ---
        const pages = [
            "Hallo Intan...\n\nSebenernya aku mau kasih surprise tapi kamu udah tau ya mengenai project ini hehe.\n\n",
            "Aku disini mau meminta maaf sekaligus merayakan ulang tahun kamu yang ke-20 yeeayyy.",
            "Aku minta maaf jika selama ini dirasa larangan ku memang begitu mengekang kamu.\n\nAku minta maaf juga jarang banget hubungin kamu.\n\nAku minta maaf ketika aku ngomong ada masalah di ingatan kamu.",
            "Niatnya aku ngasih link pada jam 00:00 cuman kurang tau nih bisa atau engga.\n\nAku juga bingung mau kasih teks seperti apa...",
            "Semoga di umur yang baru ini kamu selalu diberikan kebahagiaan, kesehatan, dan semua yang kamu impikan bisa tercapai.",
            "I love you so much intan septiani basyiroh...\n\n\nganbatteee anataaaaa❤️"
        ];

        let currentPage = 0;
        let charIndex = 0;
        let isTyping = false;
        let typingTimer;

        function typeWriter() {
            if (charIndex < pages[currentPage].length) {
                isTyping = true;
                let char = pages[currentPage].charAt(charIndex);
                
                if (char === '\n') {
                    document.getElementById("textBox").innerHTML += "<br>";
                } else {
                    document.getElementById("textBox").innerHTML += char;
                }
                
                charIndex++;
                
                let speed = 45; 
                if (currentPage === pages.length - 1) {
                    speed = 180; // Efek super lambat di kalimat terakhir
                }

                typingTimer = setTimeout(typeWriter, speed);
            } else {
                isTyping = false;
            }
        }

        function turnNextPage() {
            if (isTyping) {
                clearTimeout(typingTimer);
                document.getElementById("textBox").innerHTML = pages[currentPage].replace(/\n/g, '<br>');
                isTyping = false;
            } else {
                if (currentPage < pages.length - 1) {
                    currentPage++;
                    charIndex = 0;
                    document.getElementById("textBox").innerHTML = "";
                    typeWriter();
                }
            }
        }

        function turnPrevPage() {
            if (currentPage > 0) {
                clearTimeout(typingTimer);
                currentPage--;
                charIndex = 0;
                document.getElementById("textBox").innerHTML = "";
                isTyping = false;
                typeWriter();
            }
        }

        // --- 3. LOGIKA KEMBANG API & CAHAYA ---
        const canvas = document.getElementById('fwCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        const gravity = 0.04; // Sedikit lebih lambat jatuhnya agar cahaya lebih lama terlihat
        const colors = ['#ff0043', '#14fc56', '#1e7fff', '#e600ff', '#ffaa00'];

        class Particle {
            constructor(x, y, color, velocity, isFirework) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.isFirework = isFirework; 
                this.life = 100;
                this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                // PENCAHAYAAN (GLOW EFFECT)
                ctx.shadowBlur = this.isFirework ? 15 : 25; 
                ctx.shadowColor = this.color;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.isFirework ? 3 : 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.draw();
                this.x += this.velocity.x;
                this.y += this.velocity.y;

                if (this.isFirework) {
                    this.velocity.y += gravity; 
                } else {
                    this.velocity.y += gravity; 
                    this.velocity.x *= 0.96; // Gesekan udara
                    this.velocity.y *= 0.96;
                    this.life -= 1.2;
                    this.alpha = this.life / 100;
                }
            }
        }

        function createExplosion(x, y) {
            playExplosionSound(); // Panggil suara ledakan
            for (let i = 0; i < 60; i++) { // Jumlah percikan diperbanyak agar lebih terang
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                }, false));
            }
        }

        function launchRandomFirework() {
            if(document.getElementById('startScreen').style.display === 'none') {
                const x = Math.random() * canvas.width;
                const y = canvas.height;
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)], {
                    x: (Math.random() - 0.5) * 2.5, 
                    y: -(Math.random() * 4 + 7) 
                }, true));
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Menghapus shadow sebelum membersihkan canvas agar tidak nge-glitch
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Merubah mode komposisi agar partikel yang bertumpuk menjadi lebih terang (menyilaukan seperti cahaya asli)
            ctx.globalCompositeOperation = 'lighter';

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();

                if (p.isFirework && p.velocity.y >= 0) {
                    createExplosion(p.x, p.y);
                    particles.splice(i, 1);
                } 
                else if (!p.isFirework && p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        setInterval(launchRandomFirework, 1300);
        animate();

        window.addEventListener('pointerdown', (e) => {
            if(e.target.tagName === 'BUTTON' || e.target.closest('.text-box')) return; 

            const targetX = e.clientX;
            const targetY = e.clientY;
            
            const startX = Math.random() * canvas.width;
            const startY = canvas.height;
            
            const distanceY = startY - targetY;
            const safeDistanceY = Math.max(distanceY, 10); 
            
            const vy = -Math.sqrt(2 * gravity * safeDistanceY); 
            const t = Math.abs(vy / gravity); 
            const vx = (targetX - startX) / t; 
            
            particles.push(new Particle(startX, startY, colors[Math.floor(Math.random() * colors.length)], {
                x: vx,
                y: vy
            }, true));
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
